<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .system-box {
    fill: #fdf4ff;
    stroke: #7e22ce;
    stroke-width: 2.5;
    rx: 8;
  }
  .system-title {
    font-size: 16px;
    font-weight: bold;
    fill: #581c87;
    text-anchor: middle;
  }
  .actor-text {
    font-size: 13px;
    font-weight: bold;
    fill: #1e293b;
    text-anchor: middle;
  }
  .usecase {
    fill: #ffffff;
    stroke: #a855f7;
    stroke-width: 2;
  }
  .usecase-text {
    font-size: 12px;
    font-weight: 600;
    fill: #3b0764;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .assoc-line {
    stroke: #334155;
    stroke-width: 1.5;
  }
  .include-line {
    stroke: #a855f7;
    stroke-width: 1.5;
    stroke-dasharray: 4, 4;
  }
  .include-label {
    font-size: 11px;
    font-style: italic;
    fill: #7e22ce;
    text-anchor: middle;
  }
</style>
</head>
<body>

<svg width="950" height="520" viewBox="0 0 950 520" xmlns="http://www.w3.org/2000/svg">
  <text x="475" y="28" font-size="18" font-weight="bold" fill="#6b21a8" text-anchor="middle">Diagrama de Casos de Uso - Sistema Doce Encanto (Jéssica)</text>

  <!-- Limite do Sistema -->
  <rect x="220" y="50" width="510" height="440" class="system-box" />
  <text x="475" y="80" class="system-title">Sistema de Gestão Comercial e Pedidos</text>

  <!-- Ator: Jessica / Atendente (x=110, y=240) -->
  <g id="actor-jessica">
    <circle cx="110" cy="210" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <line x1="110" y1="226" x2="110" y2="265" stroke="#1e293b" stroke-width="2"/>
    <line x1="85" y1="240" x2="135" y2="240" stroke="#1e293b" stroke-width="2"/>
    <line x1="110" y1="265" x2="90" y2="300" stroke="#1e293b" stroke-width="2"/>
    <line x1="110" y1="265" x2="130" y2="300" stroke="#1e293b" stroke-width="2"/>
    <text x="110" y="325" class="actor-text">Jéssica</text>
    <text x="110" y="342" class="actor-text">(Proprietária)</text>
  </g>

  <!-- Ator Secundario: Servico de Notificacao (x=840, y=180) -->
  <g id="actor-notificacao">
    <rect x="770" y="150" width="140" height="60" fill="#f8fafc" stroke="#1e293b" stroke-width="2" rx="6"/>
    <text x="840" y="172" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">&lt;&lt;sistema externo&gt;&gt;</text>
    <text x="840" y="192" class="actor-text" font-size="12">Serviço de</text>
    <text x="840" y="205" class="actor-text" font-size="12">Notificação</text>
  </g>

  <!-- Casos de Uso -->
  <!-- UC01: Registrar Pedido -->
  <ellipse cx="380" cy="140" rx="110" ry="24" class="usecase" />
  <text x="380" y="140" class="usecase-text">Registrar Pedido</text>

  <!-- UC02: Notificar Cliente (include) -->
  <ellipse cx="610" cy="180" rx="100" ry="24" class="usecase" />
  <text x="610" y="180" class="usecase-text">Notificar Cliente</text>

  <!-- UC03: Consultar Agenda -->
  <ellipse cx="380" cy="230" rx="120" ry="24" class="usecase" />
  <text x="380" y="230" class="usecase-text">Consultar Agenda de Entregas</text>

  <!-- UC04: Controlar Estoque -->
  <ellipse cx="380" cy="320" rx="120" ry="24" class="usecase" />
  <text x="380" y="320" class="usecase-text">Atualizar Estoque</text>

  <!-- UC05: Gerar Relatorios -->
  <ellipse cx="380" cy="410" rx="125" ry="24" class="usecase" />
  <text x="380" y="410" class="usecase-text">Emitir Relatórios Financeiros</text>

  <!-- Linhas de Associacao -->
  <line x1="135" y1="240" x2="270" y2="145" class="assoc-line" />
  <line x1="135" y1="250" x2="260" y2="230" class="assoc-line" />
  <line x1="135" y1="260" x2="260" y2="320" class="assoc-line" />
  <line x1="135" y1="270" x2="260" y2="405" class="assoc-line" />

  <!-- Include de Registrar Pedido para Notificar Cliente -->
  <line x1="485" y1="155" x2="520" y2="170" class="include-line" marker-end="url(#arr)" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>
  <text x="495" y="185" class="include-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Notificar Cliente conectado ao Servico Externo -->
  <line x1="710" y1="180" x2="770" y2="180" class="assoc-line" />

</svg>

</body>
</html>
